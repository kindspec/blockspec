[project]
name = "blockspec"
version = "0.1.0"
description = "A specification and conformance suite for prose documents that must survive version control"
readme = "README.md"
requires-python = ">=3.11"
# `reference/` is standard-library-only: a dependency there is a dependency
# every independent implementation of the format inherits. tests/test_boundary.py
# fails if anything under `reference/` imports outside the standard library.
dependencies = []
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Cameron Brooks" }]
keywords = ["markdown", "git", "merge", "conformance", "specification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/kindspec/blockspec"
Source = "https://github.com/kindspec/blockspec"
Issues = "https://github.com/kindspec/blockspec/issues"
Specification = "https://github.com/kindspec/blockspec/blob/main/SPEC.md"

[project.scripts]
blockspec = "blockspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference/blockspec"]

# The sdist carries the spec and the fixture tree, and leaves out spike/, which
# is hundreds of megabytes of measurement.
[tool.hatch.build.targets.sdist]
include = [
  "/reference",
  "/conformance",
  "/tests",
  "/docs",
  "/SPEC.md",
  "/README.md",
  "/DESIGN-BRIEF.md",
  "/NOTICE",
  "/LICENSE",
  "/LICENSES",
  "/justfile",
  "/pyproject.toml",
]

# kindkit is the shared conformance machinery: the tree-driven runner and the
# mutation gate. A DEV dependency, so `reference/` still imports the standard
# library and nothing else; only `conformance/` reaches for it.
#
# Pinned to a COMMIT, the one conformance.yml's KINDKIT_SHA names and
# conformance/run_cases.py's docstring quotes. Move all three together;
# tests/test_pins.py fails when pyproject and the workflow differ.
[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "kindkit @ git+https://github.com/kindspec/kindkit@6ebd80daba23e0d49a19e24b7ee4c85cedb926df",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The spike has its own conventions and is not this change's to reformat.
# And no Markdown: ruff formats code blocks in .md files, and the fixtures in
# conformance/cases/ are exact bytes (kindspec/.github AGENTS.md section 5).
extend-exclude = ["spike", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reference", "conformance"]
